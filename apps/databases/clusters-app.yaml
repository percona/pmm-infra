apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: database-clusters
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/percona/pmm-infra.git
    targetRevision: gitops
    path: pmm-infra/apps/databases/clusters
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
