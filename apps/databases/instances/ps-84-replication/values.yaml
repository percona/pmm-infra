secrets:
  users:
    root: "ROOT_PASSWORD"
    xtrabackup: "XTRABACKUP_PASSWORD"
    monitor: "MONITOR_PASSWORD"
    clustercheck: "CLUSTERCHECK_PASSWORD"
    proxyadmin: "PROXYADMIN_PASSWORD"
    pmmserver: "PMMSERVER_PASSWORD"
    sysbench: "SYSBENCH_PASSWORD"
    replica: "REPLICA_PASSWORD"
    proxysql: "PROXYSQL_PASSWORD"
    pmm-admin: "PMM_ADMIN_PASSWORD"
    consul-health-check: "CONSUL_HEALTH_CHECK_PASSWORD"
    sysbench-direct-ps84: "SYSBENCH_DIRECT_PS84_PASSWORD"
    sysbench-proxysql-ps84: "SYSBENCH_PROXYSQL_PS84_PASSWORD"

mysql:
  image:
    repository: percona/percona-server
    tag: "8.4"
  size: 2 # Explicitly set size to 2 for source-replica
  clusterType: asynchronous # Explicitly set replication type
  resources:
    requests:
      memory: "1Gi"
      cpu: "500m"
    limits:
      memory: "2Gi"
      cpu: "1"
  volumeSpec:
    pvc:
      resources:
        requests:
          storage: "10Gi" # Corrected path to match chart: volumeSpec.pvc

pmm:
  enabled: true
  serverHost: 'pmm-server'
  serverUser: 'admin'
  # resource requests for pmm client (optional but good practice)
  resources:
    requests:
      memory: 150M
      cpu: 300m

proxy:
  haproxy:
    enabled: false # Explicitly disable HAProxy
    size: 0 # Ensure no HAProxy pods are created if disabled
  router:
    enabled: false # Explicitly disable Router if not needed

backup:
  enabled: false # Explicitly disable backup
  storages: {} # Ensure this is an empty object if disabled
  schedule: [] # Ensure tasks is an empty array if disabled