#cloud-config
fqdn: ${fqdn}
hostname: ${name}
manage_etc_hosts: true
prefer_fqdn_over_hostname: true
preserve_hostname: false
package_upgrade: true
package_update: true

packages:
  - bind-utils
  - curl
  - jq
  - podman
  - podman-docker
  - python3-pip

bootcmd:
  - while [[ ! -b $(readlink -f /dev/nvme1n1) ]]; do echo "waiting for the disk..."; sleep 5; done
  - mkfs.xfs -L data /dev/nvme1n1
  - mkdir -p /var/lib/containers/

mounts:
  - ["/dev/nvme1n1", "/var/lib/containers/", "xfs", "defaults,noatime", "0", "2"]

runcmd:
  - dnf config-manager --add-repo https://rpm.releases.hashicorp.com/AmazonLinux/hashicorp.repo
  - dnf -y install consul
  - systemctl enable consul
  - bash /root/consul-advertise-addr.sh
  - systemctl start consul
  - dnf install -y https://repo.percona.com/yum/percona-release-latest.noarch.rpm
  - percona-release setup -y ps-80
  - dnf -y install percona-server-client
  - docker pull docker.io/percona/pmm-server:3
  - docker create -v /srv --name pmm-data docker.io/percona/pmm-server:3 /bin/true
  - docker network create pmm-net
  - docker run -d -p 443:8443 -v pmm-data:/srv:Z --name pmm-server --network pmm-net --restart always docker.io/percona/pmm-server:3
  - sleep 10s
  - docker exec pmm-server change-admin-password ${pmm_admin_pass}
  - "echo '${pmm_admin_pass}' > /root/pmm-admin-password"
  - chmod 400 /root/pmm-admin-password
  - bash /root/apply-custom-settings.sh
  - bash /root/ensure-clickhouse-hardening.sh
  - systemctl enable --now pmm-clickhouse-hardening.timer
  - echo date > /tmp/pmm-server-up
  - percona-release setup -y pmm3-client
  - dnf -y install pmm-client
  - curl -s ${scripts_path}/waiter.sh -o /usr/local/bin/waiter.sh
  - chmod 0755 /usr/local/bin/waiter.sh
  - bash /usr/local/bin/waiter.sh readyz ${name} ${fqdn} ${environment_name}
  - pmm-admin config --az="us-east-1f" --region="us-east-1" --metrics-mode=push --force --server-insecure-tls --server-url='https://admin:${pmm_admin_pass}@${pmm_server_endpoint}' ${fqdn} generic "${name}-host"
  - dnf -y install https://github.com/ncabatoff/process-exporter/releases/download/v0.8.5/process-exporter_0.8.5_linux_amd64.rpm
  - bash /usr/local/bin/waiter.sh process-exporter ${name} ${fqdn} ${environment_name}
  - pmm-admin add external --group=processes --listen-port=9256 --environment="prod" --service-name="${name}-processes" --cluster="processes-cluster"
  - bash /root/add-rds-to-pmm.sh
  - bash pip3 install ansible

write_files:
  - path: /etc/resolv.conf
    permissions: "0644"
    content: |
      ; generated by #cloud-config
      search ${local_domain} ec2.internal
      options timeout:2 attempts:5
      nameserver 10.0.0.2

  - path: /etc/consul.d/consul.hcl
    permissions: "0644"
    content: |
      bind_addr = "0.0.0.0"
      bootstrap_expect=3
      client_addr = "0.0.0.0"
      data_dir = "/opt/consul"
      enable_local_script_checks = true
      enable_syslog = true
      node_name="${name}"
      retry_join = ["pmm-server", "sysbench", "bastion"]
      server = true
      ui_config{
        enabled = true
      }

  - path: /root/add-rds-to-pmm.sh
    permissions: "0700"
    content: |
      #!/bin/bash

      # Discover RDS using PMM
      curl -k -X POST https://admin:${pmm_admin_pass}@localhost/v1/management/services:discoverRDS >/tmp/discovered_rds

      # Manipulate the JSON to add username, password, and enable query examples
      jq '{rds: .rds_instances[0]} \
        | .rds.username = "${rds_mysql_username}" \
        | .rds.password = "${rds_mysql_password}" \
        | .rds.disable_query_examples = false' /tmp/discovered_rds \
        >pmm_rds_mysql.json

      # Add to PMM
      curl -k -X POST https://admin:${pmm_admin_pass}@localhost/v1/management/services -d@pmm_rds_mysql.json

      exit 0

  - path: /etc/consul.d/process-exporter-check-http.json
    permissions: "0644"
    content: |
      {
        "service": {
          "address": "${fqdn}",
          "name": "process-exporter",
          "port": 9256,
          "tags": ["${name}"],
          "checks": [{
            "http": "http://${fqdn}:9256/metrics",
            "interval": "3s",
            "success_before_passing": 3,
            "timeout": "5s"
          }]
        }
      }

  - path: /usr/local/bin/waiter.sh
    permissions: "0755"
    content: |
      #!/bin/bash
      # Script to do all the waiting
      # File contents will be downloaded from githubcontent.com

  - path: /root/consul-advertise-addr.sh
    permissions: "0700"
    content: |
      #!/bin/bash
      my_private_ip=$(ip a sh eth0 | awk '/inet / {print $2}' | awk -F '/' '{print $1}')
      echo "advertise_addr = \"$my_private_ip\"" >> /etc/consul.d/consul.hcl

  - path: /root/playbooks/pmm_sso_playbook.yml
    permissions: "0400"
    content: |
      ---
      # This playbook contains tasks executed for pmmdemo
      - hosts: localhost
        become: no
        gather_facts: yes
        tasks:
          - name: Add posthog stats
            ansible.builtin.blockinfile:
              path: /usr/share/grafana/public/views/index.html
              insertbefore: "</head>"
              marker: "<!-- {mark} ANSIBLE -->"
              block: |
                <script>
                  !function(t,e){var o,n,p,r;e.__SV||(window.posthog=e,e._i=[],e.init=function(i,s,a){function g(t,e){var o=e.split(".");2==o.length&&(t=t[o[0]],e=o[1]),t[e]=function(){t.push([e].concat(Array.prototype.slice.call(arguments,0)))}}(p=t.createElement("script")).type="text/javascript",p.crossOrigin="anonymous",p.async=!0,p.src=s.api_host.replace(".i.posthog.com","-assets.i.posthog.com")+"/static/array.js",(r=t.getElementsByTagName("script")[0]).parentNode.insertBefore(p,r);var u=e;for(void 0!==a?u=e[a]=[]:a="posthog",u.people=u.people||[],u.toString=function(t){var e="posthog";return"posthog"!==a&&(e+="."+a),t||(e+=" (stub)"),e},u.people.toString=function(){return u.toString(1)+".people (stub)"},o="init capture register register_once register_for_session unregister unregister_for_session getFeatureFlag getFeatureFlagPayload isFeatureEnabled reloadFeatureFlags updateEarlyAccessFeatureEnrollment getEarlyAccessFeatures on onFeatureFlags onSessionId getSurveys getActiveMatchingSurveys renderSurvey canRenderSurvey identify setPersonProperties group resetGroups setPersonPropertiesForFlags resetPersonPropertiesForFlags setGroupPropertiesForFlags resetGroupPropertiesForFlags reset get_distinct_id getGroups get_session_id get_session_replay_url alias set_config startSessionRecording stopSessionRecording sessionRecordingStarted captureException loadToolbar get_property getSessionProperty createPersonProfile opt_in_capturing opt_out_capturing has_opted_in_capturing has_opted_out_capturing clear_opt_in_out_capturing debug getPageViewId captureTraceFeedback captureTraceMetric".split(" "),n=0;n<o.length;n++)g(u,o[n]);e._i.push([i,s,a])},e.__SV=1)}(document,window.posthog||[]);
                  posthog.init('phc_Vn0gwOhJP57oTdX4Y7xqkJ4dB40j2Ti2KPVaG3s59a9', {
                    api_host: '<https://eu.i.posthog.com>',
                    persistence:'sessionStorage'
                  })
                </script>

          - name: Set Google Analytics ID
            ini_file:
              dest: /etc/grafana/grafana.ini
              section: analytics
              option: google_analytics_ua_id
              value: ${google_analytics_id}

          - name: Enable anonymous access (readonly)
            ini_file:
              dest: /etc/grafana/grafana.ini
              section: auth.anonymous
              option: enabled
              value: "true"

          # Pin the anonymous role explicitly rather than relying on the Grafana
          # default. Note that a Viewer may still query every registered
          # datasource via /api/ds/query -- Grafana OSS has no setting that
          # changes this -- so each datasource must authenticate as a
          # least-privilege, read-only database identity.
          - name: Pin anonymous role to Viewer
            ini_file:
              dest: /etc/grafana/grafana.ini
              section: auth.anonymous
              option: org_role
              value: "Viewer"

          - name: Prevent viewers from gaining edit rights
            ini_file:
              dest: /etc/grafana/grafana.ini
              section: users
              option: viewers_can_edit
              value: "false"

          - name: Set domain name
            ini_file:
              dest: /etc/grafana/grafana.ini
              section: server
              option: domain
              value: ${full_domain}

          - name: Disable telemetry
            ini_file:
              dest: /etc/grafana/grafana.ini
              section: analytics
              option: reporting_enabled
              value: "false"

          - name: Disable updates
            ini_file:
              dest: /etc/grafana/grafana.ini
              section: analytics
              option: check_for_updates
              value: "false"

          - name: Enable alerting
            ini_file:
              dest: /etc/grafana/grafana.ini
              section: alerting
              option: enabled
              value: "false"

          - name: Enable secure cookies
            ini_file:
              dest: /etc/grafana/grafana.ini
              section: security
              option: cookie_secure
              value: "true"

          - name: Set auth cookie name
            ini_file:
              dest: /etc/grafana/grafana.ini
              section: auth
              option: login_cookie_name
              value: pmm_session

          - name: Set max login duration
            ini_file:
              dest: /etc/grafana/grafana.ini
              section: auth
              option: login_maximum_lifetime_duration
              value: 7d

          - name: Enable unified alerting
            ini_file:
              dest: /etc/grafana/grafana.ini
              section: unified_alerting
              option: enabled
              value: "true"

          - name: Set instance name
            ini_file:
              dest: /etc/grafana/grafana.ini
              section: DEFAULT
              option: instance_name
              value: "PMM Demo"

          - name: Enable panel alpha feature
            ini_file:
              dest: /etc/grafana/grafana.ini
              section: panels
              option: enable_alpha
              value: "true"

          - name: Configure PMM's connection to the Portal
            when: ${oauth_enable}
            block:
            # TODO use loop instead block here
            - ini_file:
                dest: /etc/grafana/grafana.ini
                section: auth.generic_oauth
                option: enabled
                value: "true"

            - ini_file:
                dest: /etc/grafana/grafana.ini
                section: auth.generic_oauth
                option: name
                value: "Percona Account"

            - ini_file:
                dest: /etc/grafana/grafana.ini
                section: auth.generic_oauth
                option: client_id
                value: ${oauth_client_id}

            - ini_file:
                dest: /etc/grafana/grafana.ini
                section: auth.generic_oauth
                option: client_secret
                value: ${oauth_secret}

            - ini_file:
                dest: /etc/grafana/grafana.ini
                section: auth.generic_oauth
                option: scopes
                value: ${oauth_scopes}

            - ini_file:
                dest: /etc/grafana/grafana.ini
                section: auth.generic_oauth
                option: auth_url
                value: ${oauth_url}

            - ini_file:
                dest: /etc/grafana/grafana.ini
                section: auth.generic_oauth
                option: token_url
                value: ${oauth_token_url}

            - ini_file:
                dest: /etc/grafana/grafana.ini
                section: auth.generic_oauth
                option: api_url
                value: ${oauth_api_url}

            - ini_file:
                dest: /etc/grafana/grafana.ini
                section: auth.generic_oauth
                option: role_attribute_path
                value: ${oauth_role_attribute_path}

            - ini_file:
                dest: /etc/grafana/grafana.ini
                section: auth
                option: signout_redirect_url
                value: ${oauth_signout_redirect_url}

  - path: /root/upgrade-pmm-server.sh
    permissions: "0755"
    content: |
      #!/bin/bash -xe

      docker pull docker.io/percona/pmm-server:3
      docker stop pmm-server && docker rm pmm-server

      docker run -d -p 443:8443 -v pmm-data:/srv:Z --name pmm-server --network pmm-net --restart always docker.io/percona/pmm-server:3
      echo "PMM Server has been successfully upgraded to the next version. Don't forget to purge the old image."

      echo "Applying Grafana Settings for PMM Demo..."
      bash /root/apply-custom-settings.sh

      # The rm/run above discarded the container's writable layer, which is
      # where grafana.ini names the ClickHouse account. Without this the new
      # container comes up with Grafana authenticating as the ClickHouse
      # superuser again. Run as a child process so that the -x trace on this
      # script does not leak the password the hardening script generates.
      echo "Re-asserting ClickHouse least-privilege hardening..."
      bash /root/ensure-clickhouse-hardening.sh

  - path: /root/upgrade-pmm-agents.sh
    permissions: "0755"
    content: |
      #!/bin/bash

      # Get list of agent hosts, output ansible inventory format
      echo "[all]" >/root/agents_inventory
      /bin/consul catalog nodes | grep -v Node | awk '{print $1".pmmdemoprod.local"}' >>/root/agents_inventory

      # Run playbook to upgrade pmm-agent on servers
      export ANSIBLE_HOST_KEY_CHECKING=False
      /usr/local/bin/ansible-playbook -i agents_inventory upgrade_agents_playbook.yml

  - path: /root/playbooks/upgrade_agents.yml
    permissions: "0644"
    content: |
      #
      # Playbook for upgrade pmm-agent on hosts
      #

      - hosts: all
        gather_facts: no
        remote_user: rocky
        become: yes
        tasks:

        - name: Enable Percona Repo
          shell: >
            percona-release enable pmm3-client

        - name: Upgrade PMM Agent
          dnf:
            state: latest
            name: "pmm-client"
          register: restart_agent

        - name: Restart PMM Agent
          systemd:
            name: "pmm-agent"
            enabled: yes
            state: "restarted"
          when: restart_agent.changed

  - path: /root/apply-custom-settings.sh
    permissions: "0755"
    content: |
      #!/bin/bash -xe

      echo "Running the ansible script..."
      docker cp /root/pmm_sso_playbook.yml pmm-server:pmm_sso_playbook.yml
      docker exec pmm-server ansible-playbook -v pmm_sso_playbook.yml
      sleep 10
      docker exec pmm-server supervisorctl restart grafana
      echo "PMM settings updated."
  - path: /root/ensure-clickhouse-hardening.sh
    permissions: "0700"
    content: |
      #!/bin/bash
      # Re-apply the ClickHouse least-privilege hardening if pmm-server has lost it.
      #
      # grafana_ro lives in ClickHouse's access store under /srv, which is on the
      # persistent pmm-data volume, so the account itself survives anything short
      # of wiping that volume. What does not survive is the pointer to it:
      # Grafana reads its ClickHouse credentials from /etc/supervisord.d/grafana.ini,
      # which is in the container's writable layer. Any docker rm + docker run --
      # a PMM upgrade, or a manual recreate -- resets that file, and Grafana comes
      # back authenticating as the ClickHouse superuser with no visible symptom.
      #
      # The test is a grep rather than a login because the generated password is
      # deliberately not stored anywhere on the host. grafana.ini still naming
      # grafana_ro is sufficient proof that the writable layer is intact.

      set -euo pipefail

      GRAFANA_INI=/etc/supervisord.d/grafana.ini

      # Serialise against the timer, cloud-init and the upgrade script, all of
      # which can call this. Note that invoking harden-clickhouse-datasource.sh
      # directly bypasses the lock; go through this wrapper instead.
      exec 9>/var/lock/pmm-clickhouse-hardening.lock
      if ! flock -n 9; then
        echo "another hardening run holds the lock; skipping."
        exit 0
      fi

      container_running () {
        [ "$(docker inspect -f '{{.State.Running}}' pmm-server 2>/dev/null || true)" = "true" ]
      }

      for _ in $(seq 1 60); do
        container_running && break
        sleep 5
      done

      # Not our business to start it, and failing here every hour while the host
      # is deliberately down would only bury a real failure in noise.
      if ! container_running; then
        echo "pmm-server is not running; nothing to do."
        exit 0
      fi

      # supervisorctl has to be answering before the hardening script can restart
      # clickhouse and grafana. version() succeeds regardless of program states.
      for _ in $(seq 1 60); do
        docker exec pmm-server supervisorctl version >/dev/null 2>&1 && break
        sleep 5
      done

      if docker exec pmm-server grep -q 'PMM_CLICKHOUSE_USER="grafana_ro",' "$GRAFANA_INI"; then
        echo "Grafana already authenticates to ClickHouse as grafana_ro; nothing to do."
        exit 0
      fi

      echo "grafana.ini does not name grafana_ro -- the container layer was reset. Re-hardening."
      exec bash /root/harden-clickhouse-datasource.sh

  - path: /etc/systemd/system/pmm-clickhouse-hardening.service
    permissions: "0644"
    content: |
      [Unit]
      Description=Ensure Grafana's ClickHouse datasource uses the least-privilege account
      Wants=network-online.target
      After=network-online.target

      [Service]
      Type=oneshot
      ExecStart=/bin/bash /root/ensure-clickhouse-hardening.sh

  - path: /etc/systemd/system/pmm-clickhouse-hardening.timer
    permissions: "0644"
    content: |
      [Unit]
      Description=Re-assert the ClickHouse hardening after a pmm-server container recreate

      # Anyone can recreate the container without going through
      # upgrade-pmm-server.sh, so do not rely on the callers alone. The check is
      # two greps when nothing is wrong, which is cheap enough to run hourly and
      # keeps the window in which Grafana is a ClickHouse superuser bounded.
      [Timer]
      OnBootSec=2min
      OnUnitActiveSec=1h
      Unit=pmm-clickhouse-hardening.service

      [Install]
      WantedBy=timers.target

  - path: /root/harden-clickhouse-datasource.sh
    permissions: "0700"
    content: |
      #!/bin/bash
      # Create a least-privilege ClickHouse identity for Grafana and point the
      # ClickHouse datasource at it, replacing the default superuser.
      #
      # The password is generated here, on the instance. It is deliberately
      # absent from Terraform state and from EC2 user-data; it exists only in
      # ClickHouse's access store (/srv/clickhouse/access) and in Grafana's
      # encrypted datasource config (/srv/grafana), both on the persistent
      # volume. Tracing is left off so the secret never reaches cloud-init logs.

      set -euo pipefail

      BOOTSTRAP_XML=/etc/clickhouse-server/default-users.d/zz-provision-bootstrap.xml
      GRAFANA_INI=/etc/supervisord.d/grafana.ini
      QAN_INI=/etc/supervisord.d/qan-api2.ini

      CH_PASS=$(openssl rand -hex 24)
      CH_HASH=$(printf '%s' "$CH_PASS" | sha256sum | awk '{print $1}')
      BOOT_PASS=$(openssl rand -hex 24)
      BOOT_HASH=$(printf '%s' "$BOOT_PASS" | sha256sum | awk '{print $1}')

      ch_wait () {
        local user=$1 pass=$2 i
        for i in $(seq 1 45); do
          if docker exec -i pmm-server clickhouse-client --host 127.0.0.1 \
               --user "$user" --password "$pass" -q "SELECT 1" >/dev/null 2>&1; then
            return 0
          fi
          sleep 2
        done
        echo "ERROR: clickhouse did not accept $user within 90s" >&2
        return 1
      }

      # PMM sets a password on the ClickHouse default superuser that is not
      # exposed to us, so install a short-lived admin to run the DDL. The users
      # config file is default-users.xml, so drop-ins must live in
      # default-users.d; and a plaintext <password> is rejected outright at
      # startup because PMM ships allow_plaintext_password=0.
      docker exec -u root pmm-server mkdir -p /etc/clickhouse-server/default-users.d
      docker exec -u root -i pmm-server bash -c "cat > $BOOTSTRAP_XML" <<XMLEOF
      <clickhouse>
          <users>
              <provision_admin>
                  <password_sha256_hex>$BOOT_HASH</password_sha256_hex>
                  <networks><ip>127.0.0.1</ip><ip>::1</ip></networks>
                  <profile>default</profile>
                  <quota>default</quota>
                  <access_management>1</access_management>
              </provision_admin>
          </users>
      </clickhouse>
      XMLEOF
      docker exec -u root pmm-server chown pmm:root "$BOOTSTRAP_XML"
      docker exec -u root pmm-server supervisorctl restart clickhouse
      ch_wait provision_admin "$BOOT_PASS"

      # grafana_ro holds SELECT and nothing else. Without the SOURCES family it
      # cannot call url(), s3(), mongodb(), remote() or file(); readonly=1
      # additionally prevents it overriding server settings such as
      # max_http_get_redirects. ALTER runs unconditionally so that re-running
      # this script rotates the password rather than failing.
      docker exec -i pmm-server clickhouse-client --host 127.0.0.1 \
        --user provision_admin --password "$BOOT_PASS" --multiquery <<SQLEOF
      CREATE SETTINGS PROFILE IF NOT EXISTS grafana_ro_profile SETTINGS
          readonly = 1, allow_ddl = 0, max_execution_time = 60;

      CREATE USER IF NOT EXISTS grafana_ro IDENTIFIED WITH sha256_hash BY '$CH_HASH';
      ALTER USER grafana_ro IDENTIFIED WITH sha256_hash BY '$CH_HASH'
          SETTINGS PROFILE grafana_ro_profile;

      REVOKE ALL ON *.* FROM grafana_ro;
      GRANT SELECT ON pmm.*            TO grafana_ro;
      GRANT SELECT ON default.*        TO grafana_ro;
      GRANT SELECT ON system.tables    TO grafana_ro;
      GRANT SELECT ON system.columns   TO grafana_ro;
      GRANT SELECT ON system.databases TO grafana_ro;
      GRANT SELECT ON system.one       TO grafana_ro;
      GRANT SELECT ON system.numbers   TO grafana_ro;
      SQLEOF

      docker exec -u root pmm-server rm -f "$BOOTSTRAP_XML"
      docker exec -u root pmm-server supervisorctl restart clickhouse
      ch_wait grafana_ro "$CH_PASS"

      # Point ONLY Grafana at grafana_ro. The datasource is provisioned from
      # /usr/share/grafana/conf/provisioning/datasources/default.yml, which
      # reads $${PMM_CLICKHOUSE_USER}/$${PMM_CLICKHOUSE_PASSWORD} from the
      # environment -- so this is a supported knob, not a file hack. It is also
      # why the Grafana HTTP API cannot be used: that datasource is provisioned,
      # so Grafana reports readOnly=true and rejects updates to it.
      #
      # Grafana and qan-api2 carry separate supervisord environment blocks.
      # Only grafana.ini is rewritten; qan-api2 keeps authenticating as default
      # so QAN ingestion retains INSERT.
      #
      # This script is re-runnable: ALTER USER above rotates grafana_ro's
      # password on every invocation, and the sed below repoints grafana.ini at
      # whatever was just generated. Keep the first .orig, though -- on a second
      # run the live file is already hardened, and copying it over .orig would
      # destroy the only record of what PMM originally shipped.
      docker exec pmm-server test -f "$GRAFANA_INI.orig" ||
        docker exec -u root pmm-server cp "$GRAFANA_INI" "$GRAFANA_INI.orig"
      docker exec -u root pmm-server sed -i \
        -e 's/PMM_CLICKHOUSE_USER="[^"]*",/PMM_CLICKHOUSE_USER="grafana_ro",/' \
        -e "s|PMM_CLICKHOUSE_PASSWORD=\"[^\"]*\",|PMM_CLICKHOUSE_PASSWORD=\"$CH_PASS\",|" \
        "$GRAFANA_INI"

      if ! docker exec pmm-server grep -q 'PMM_CLICKHOUSE_USER="grafana_ro",' "$GRAFANA_INI"; then
        echo "FATAL: grafana.ini was not rewritten" >&2
        exit 1
      fi
      if ! docker exec pmm-server grep -q 'PMM_CLICKHOUSE_USER="default",' "$QAN_INI"; then
        echo "FATAL: $QAN_INI no longer authenticates as default; QAN ingestion would lose INSERT" >&2
        exit 1
      fi

      # A bare restart does not re-read changed environment= lines.
      docker exec pmm-server supervisorctl reread
      docker exec pmm-server supervisorctl update
      docker exec pmm-server supervisorctl restart grafana

      # Fail the build rather than come up believing this worked.
      #
      # Prove the account authenticates FIRST. Otherwise a broken password makes
      # every negative check below pass for the wrong reason -- clickhouse-client
      # exits non-zero on authentication failure exactly as it does on a denied
      # grant, so "url() was refused" would be indistinguishable from "grafana_ro
      # cannot log in at all".
      if ! docker exec -i pmm-server clickhouse-client --host 127.0.0.1 \
             --user grafana_ro --password "$CH_PASS" -q "SELECT 1" >/dev/null 2>&1; then
        echo "FATAL: grafana_ro cannot authenticate; later checks would false-pass" >&2
        exit 1
      fi

      # ... then require that the refusal is specifically an access-control one.
      assert_denied () {
        local what=$1 sql=$2 out
        if out=$(docker exec -i pmm-server clickhouse-client --host 127.0.0.1 \
                   --user grafana_ro --password "$CH_PASS" -q "$sql" 2>&1); then
          echo "FATAL: grafana_ro can still $what" >&2
          exit 1
        fi
        case "$out" in
          *ACCESS_DENIED*|*"Not enough privileges"*) ;;
          *) echo "FATAL: $what failed, but not on privileges: $out" >&2; exit 1 ;;
        esac
      }
      assert_denied "reach url()" \
        "SELECT count() FROM url('http://169.254.169.254/latest/user-data','LineAsString','line String')"
      assert_denied "run DDL" \
        "CREATE TABLE default.zz_provision_check (x String) ENGINE=Memory"

      unset CH_PASS BOOT_PASS
      echo "Grafana now authenticates to ClickHouse as grafana_ro (qan-api2 unchanged)."
